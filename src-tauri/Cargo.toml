[package]
name = "dsh-work-app"
# 版本继承 workspace 根的 [workspace.package].version，与 CLI 同源同版本，
# 不再单独维护（tauri.conf.json 未设 version，Tauri 经 cargo metadata 读到
# 继承解析后的值）。此前单独维护时因 release-plz 跳过 publish = false 的
# crate，v0.1.4/v0.1.5 曾漂移到 0.1.3 未被同步。
version.workspace = true
description = "DSHWork — dsh-work 桌面应用（DeepSeek Harness 桌面壳）"
edition = "2024"
license = "MIT"
# 桌面应用不发布到 crates.io（release-plz 会跳过，也防止误执行 cargo publish）
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }

# Windows 上 canonicalize 去除 \\?\ 扩展路径前缀（node 子进程不接受该前缀）
dunce = "1"

[features]
# 自定义 feature，用于 tauri 的 macOS 私有 API 等场景（暂未使用）
custom-protocol = ["tauri/custom-protocol"]
