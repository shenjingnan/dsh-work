<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dsh-work</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #0a1a3f 0%, #0d47c8 60%, #1e90ff 100%);
      color: #fff;
      user-select: none;
    }
    img.logo { width: 180px; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { font-size: 14px; opacity: .9; }
    #error { display: none; flex-direction: column; align-items: center; gap: 16px; }
    #error pre {
      max-width: 70vw; max-height: 30vh; overflow: auto;
      background: rgba(0,0,0,.35); border-radius: 8px;
      padding: 12px; font-size: 12px; white-space: pre-wrap;
    }
    button {
      padding: 8px 28px; font-size: 14px; border: none; border-radius: 8px;
      background: #fff; color: #0d47c8; cursor: pointer; font-weight: 600;
    }
    button:hover { opacity: .85; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="dsh-work" />
  <div id="loading">
    <div class="spinner"></div>
  </div>
  <p id="status">正在启动 DeepSeek Harness…</p>
  <div id="error">
    <p>DeepSeek Harness 启动失败</p>
    <pre id="error-detail"></pre>
    <button id="retry">重试</button>
  </div>

  <script>
    // 阶段 2 接线：轮询 server_url，就绪后跳转；失败显示错误页
    const { invoke } = window.__TAURI__?.core ?? {};
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const detailEl = document.getElementById('error-detail');

    function showError(detail) {
      loadingEl.classList.add('hidden');
      statusEl.classList.add('hidden');
      errorEl.style.display = 'flex';
      detailEl.textContent = detail || '未知错误';
    }

    async function poll() {
      if (!invoke) {
        showError('Tauri API 不可用');
        return;
      }
      try {
        const result = await invoke('server_url');
        if (result.url) {
          statusEl.textContent = '正在进入…';
          location.replace(result.url);
          return;
        }
        if (result.error) {
          showError(result.error);
          return;
        }
        setTimeout(poll, 500);
      } catch (e) {
        showError(String(e));
      }
    }

    document.getElementById('retry').addEventListener('click', async () => {
      errorEl.style.display = 'none';
      loadingEl.classList.remove('hidden');
      statusEl.classList.remove('hidden');
      statusEl.textContent = '正在重启 DeepSeek Harness…';
      try {
        await invoke('restart_server');
        poll();
      } catch (e) {
        showError(String(e));
      }
    });

    poll();
  </script>
</body>
</html>
