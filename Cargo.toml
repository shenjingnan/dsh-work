[workspace]
members = [".", "src-tauri"]
resolver = "2"

# 全 workspace 共享版本：CLI（dsh-work）与桌面应用（dsh-work-app）永远同版本。
# 唯一版本号在这里维护，两个 crate 用 version.workspace = true 继承；
# release-plz 发版时 bump 这一处即可同步推进（此前桌面应用单独维护版本，
# 因 release-plz 跳过 publish = false 的 crate，v0.1.4/v0.1.5 曾漂移未同步）。
[workspace.package]
version = "0.1.6"

[package]
name = "dsh-work"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "dsh-work CLI 工具"
license = "MIT"
repository = "https://github.com/shenjingnan/dsh-work"

[dependencies]
# CLI 框架
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# --- 可选依赖（按需取消注释） ---
# reqwest = { version = "0.12", features = ["json"] }   # HTTP 客户端
# url = "2"                                              # URL 解析
# futures-util = "0.3"                                   # 异步流处理

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
