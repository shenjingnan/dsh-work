name: CI

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**/*.rs', 'src-tauri/**', 'tests/**']
  pull_request:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**/*.rs', 'src-tauri/**', 'tests/**']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure components for project toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo build artifacts
        # 缓存 ~/.cargo（registry）+ target/。key 由 rustc 版本 + Cargo.lock
        # 生成；Cargo.lock 未变时自动回退恢复最近一份缓存。保存前自动剔除
        # workspace 自身 crate 的产物，避免缓存随每次提交膨胀。
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Format check
        run: cargo fmt --check

      - name: Lint check
        run: cargo clippy -- -D warnings

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: Spell check
        run: typos .

      # 不在本 job 跑 cargo test：test matrix job 已在 ubuntu/macOS/Windows
      # 三平台覆盖同一命令；此处重复跑会因 dev-deps 的 feature 统一差异
      # 触发第二次全量重建。
      - name: Build
        run: cargo build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        # tarpaulin 不能与 clippy/build 共用同一个 target/ 缓存：tarpaulin
        # 会用插桩 RUSTFLAGS 全量重建，共 job 时 job 结束快照里只剩插桩产物，
        # 下一 run 的 clippy/build 全部指纹失配，被迫每次从零编译。拆成独立
        # job 后本 job 的 target/ 只有插桩这一种构建上下文，缓存自洽。
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --out lcov --output-dir coverage -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Tests
        run: cargo test -- --test-threads=1
