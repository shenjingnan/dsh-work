name: Release

# release-plz 打出 vX.Y.Z tag 后触发：先在原生 runner 上构建
# Windows / macOS（双架构）/ Linux 的安装包并上传为 workflow artifacts
# （此阶段不创建 Release），全平台成功后由 release job 汇总产物、
# 重命名为用户友好的资产名、生成下载表格正文并一次性发布正式 Release。
#
# 集中收尾（而非各平台直接上传 Release）有两点收益：
# 1. 资产重命名与下载表格必须在全平台产物汇总后统一处理；
# 2. release job needs: build，四个矩阵全部成功才创建 Release，不会出现
#    部分平台失败导致不完整产物公开的问题（v0.1.2 曾因 AppImage 失败踩坑），
#    因此不再需要此前的「releaseDraft 草稿 + publish-release 转正」两步机制。
#
# Release 发布成功后，由 upload-baidu-pan job（同 run 内 workflow_call 调用
# upload-baidu-pan.yml）将资产与说明文档自动上传百度网盘。
on:
  push:
    tags: ['v*']
    # 验收通道：debug/perf 分支推送即触发完整 4 平台构建，产物体积在 run 的
    # Artifacts 页面核对（新 CI 步骤在合入 main 到下个 tag 之间从未真正
    # 执行过，#23/#28 教训）。分支 push 不以 refs/tags/ 开头，release job
    # 的 if 会跳过发布，止步于 artifacts。
    branches: ['debug/**', 'perf/**']
  # 手动验收通道（合入 main 后生效，dispatch 要求触发器已存在于默认分支）：
  # 行为同上，构建止步于 artifacts、不创建 Release——dispatch 时
  # GITHUB_REF_NAME 是分支名而非 tag，发布会产生错误的资产链接。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    # 用 triple 命名：macOS 双架构同为 macos-latest runner，platform 无法区分
    name: Build (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 双架构都在 macos-latest（Apple Silicon）上构建：arm64 原生、
          # x64 交叉编译（下方 rustup target add）。macos-13（Intel runner）
          # 已于 2025-12-04 被 GitHub 退役，不可用。
          - platform: macos-latest
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            triple: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ''
          # ubuntu-22.04 镜像 2026-09-17 起废弃（actions/runner-images#14254），已迁 24.04
          - platform: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install macOS cross-compile targets
        # x86_64-apple-darwin 条目在 arm64 runner 上交叉编译，需显式安装目标；
        # aarch64 一并安装保证两个矩阵条目行为一致
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build artifacts
        # 按 triple 分缓存线：macOS 双 target 两个矩阵条目若共用 key 会互相
        # 覆盖，导致另一条永远冷缓存（对齐 zapmomo 的处理）。
        # 注意：prefix-key 变更后的首次构建会全量重建一次。
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-${{ matrix.triple }}

      - name: Install Tauri Linux dependencies
        # 24.04（noble）移除了 libappindicator3-dev，改用 Tauri v2 官方
        # prerequisites 的 ayatana 维护分支；webkit 用的是 4.1 系，24.04 仍提供
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache bundled dsh
        # @deepseek-ai/dsh 含多平台原生二进制、体积大，pnpm add 纯属网络下载；
        # 产物内容只由 dsh-version.txt 决定，命中后 fetch-dsh.sh 直接跳过安装。
        # 按 OS 分缓存线（unix 可执行位跨 OS 恢复不保真），macOS 双 target 共线。
        uses: actions/cache@v6
        with:
          path: src-tauri/resources/dsh
          key: dsh-${{ runner.os }}-${{ hashFiles('dsh-version.txt') }}

      - name: Fetch bundled dsh
        shell: bash
        run: ./scripts/fetch-dsh.sh

      - name: Cache Node runtime and pnpm
        # Node 官方二进制（~40-80MB）按 triple 各一份；NODE_VERSION/PNPM_VERSION
        # 硬编码在 fetch-runtime.sh 内，脚本内容变化即产生新 key，随版本升级失效。
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/binaries
            src-tauri/resources/pnpm
          key: runtime-${{ matrix.triple }}-${{ hashFiles('scripts/fetch-runtime.sh') }}

      - name: Fetch Node runtime and pnpm
        shell: bash
        run: ./scripts/fetch-runtime.sh ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v1
        # 只构建并把产物上传为 workflow artifacts，不创建 Release：资产重命名
        # 与下载表格由下方 release job 在全平台产物汇总后统一处理。
        # 必须用 v1：v0 没有 uploadWorkflowArtifacts 输入。
        # 仅 Windows 由 action 直接上传；macOS/Linux 关闭 action 上传、改为
        # 下方手动上传——macOS 要在 dmg 落盘后注入 Gatekeeper 修复脚本、
        # Linux 要把 deb 重打包为 xz，都发生在产物落盘之后、上传之前
        # （action 的上传时机插不进自定义步骤）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage 的 squashfs 默认 gzip 压缩（161MB），linuxdeploy 的
          # appimage 插件支持 LDAI_COMP 环境变量指定算法，xz 后约 -30%。
          # 子进程 linuxdeploy 继承此 env；其他平台不读该变量，无条件设置。
          LDAI_COMP: xz
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: ${{ runner.os == 'Windows' }}

      - name: Stage macOS bundles and inject Gatekeeper fixer
        # 产物先拷到 staged/ 扁平目录再上传：upload-artifact 以多行 path 的
        # 公共祖先为根保留目录结构，直接上传 bundle/ 会带出 dmg/、macos/ 子目录，
        # release job 下载合并后 `for f in *` 就扫不到文件了。
        # dmg 注入「首次打开修复.command」见 scripts/patch-dmg-gatekeeper.sh 头注释：
        # 未签名 app 被 Gatekeeper 报「已损坏」，用户双击脚本即完成 xattr 修复。
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # 注意是仓库根的 target/ 而非 src-tauri/target/：根 Cargo.toml 定义了
          # workspace（members 含 src-tauri），cargo 把全部产物统一放在
          # workspace 根的 target/（v0.1.5 曾因写成 src-tauri/target/ 导致
          # macOS 双架构 cp 找不到产物而失败）
          BUNDLE="target/${{ matrix.triple }}/release/bundle"
          mkdir -p staged
          cp "$BUNDLE"/dmg/*.dmg staged/
          cp "$BUNDLE"/macos/*.app.tar.gz staged/
          for dmg in staged/*.dmg; do
            ./scripts/patch-dmg-gatekeeper.sh "$dmg"
          done
          ls -l staged

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.triple }}
          path: staged/*

      - name: Stage Linux bundles and repack deb with xz
        # deb 的 data.tar 由 tauri-bundler 硬编码 gzip 打包（debian.rs 用
        # flate2，无配置项），只能产物落盘后用 dpkg-deb 重打包为 xz
        # （96.8MB → ~57MB，压缩级别用默认 6：xz 单线程，-9 耗时翻倍只省 ~1%）。
        # rpm（tauri.conf.json compression=xz）与 AppImage（LDAI_COMP=xz）
        # 构建期已生效，原样拷贝即可。
        # fakeroot：保证重打包后 data.tar 内属主仍为 root:root——runner 上
        # 非特权用户直接 -b 会把真实 uid/gid 写进 tar，安装后文件属主错乱。
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y fakeroot
          # 注意是仓库根 target/（workspace 布局，见上方 macOS 步骤注释）；
          # Linux 未传 --target，产物在 target/release/bundle/（无 triple 层）
          BUNDLE="target/release/bundle"
          mkdir -p staged
          cp "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm "$BUNDLE"/appimage/*.AppImage staged/
          for deb in staged/*.deb; do
            REPACK="$(mktemp -d)/pkg"
            dpkg-deb -R "$deb" "$REPACK"
            fakeroot dpkg-deb -b -Zxz "$REPACK" "$deb"
          done
          ls -l staged

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.triple }}
          path: staged/*

  release:
    name: Create GitHub Release
    # needs: build 保证四个平台全部构建成功才走到这里，一次性发布正式 Release。
    # 仅 tag 触发时发布：workflow_dispatch 验收构建止步于 artifacts，
    # 不创建 Release（见 on.workflow_dispatch 注释；release 被跳过时
    # needs 它的 upload-baidu-pan 一并跳过）。
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true

      - name: Rename installers to user-friendly asset names
        # Tauri 产物默认名对普通用户不友好：平台术语混杂
        # （x64-setup / aarch64 / amd64 / x86_64 / en-US.msi）；
        # Windows 双安装包、macOS 双架构无选择指引。统一重命名为
        # <产品>_<平台>_<架构>.<后缀>，Release 资产列表按平台自动分组排序。
        # 刻意不注入版本号：资产名跨版本保持不变，README 等处的
        # releases/latest/download/<文件名> 直链因此永远指向最新版。
        # 代价是下载到本地的文件名不含版本号（0.1.x 阶段可接受）；
        # 未来启用 Tauri updater 时需恢复版本化资产。
        # 未启用 updater（无 .sig 签名文件），重命名不影响任何校验。
        # 注意：aarch64.dmg 分支必须在 x64.dmg 之前（前者同样匹配 *x64.dmg）。
        # .app.tar.gz 面向高级用户（手动解包场景），保留 Tauri 原名不重命名。
        shell: bash
        run: |
          shopt -s nullglob
          for f in *; do
            case "$f" in
              *x64-setup.exe)  mv "$f" "DSHWork_Windows_x64.exe" ;;
              *_en-US.msi)     mv "$f" "DSHWork_Windows_x64.msi" ;;
              *aarch64.dmg)    mv "$f" "DSHWork_macOS_arm64.dmg" ;;
              *x64.dmg)        mv "$f" "DSHWork_macOS_x64.dmg" ;;
              *amd64.deb)      mv "$f" "DSHWork_Linux_amd64.deb" ;;
              *x86_64.rpm)     mv "$f" "DSHWork_Linux_x86_64.rpm" ;;
              *amd64.AppImage) mv "$f" "DSHWork_Linux_amd64.AppImage" ;;
            esac
          done
          ls -1

      - name: Generate release body (download guide)
        # 生成带「平台选择表格 + 下载按钮」的正文。资产名不含版本号（见上方
        # rename step），故链接用 <tag>/<固定文件名> 指向本次发布的具体资产。
        # generate_release_notes 的自动变更日志会追加在 body 之后（表格在上、changelog 在下）。
        # 徽章用 shields.io 静态徽章：URL 以 '-' 开头留空左标签段，
        # 按钮只显示「立即下载」（文件名/架构信息由表格前两列承担）。
        # Windows 图标用 data URI 内嵌：simple-icons 已移除 Microsoft 系图标，
        # logo=windows 不生效（无图标且按钮比其他平台窄 20px）。
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > release_body.md <<EOF
          ## 📦 下载

          | 系统 | 芯片 / 架构 | 下载 | 说明 |
          | --- | --- | --- | --- |
          | **Windows 10 / 11** | x64 | [![Windows](https://img.shields.io/badge/-立即下载-0078D6?logo=data:image/svg%2Bxml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI%2BPHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0wIDBoMTEuNHYxMS40SDB6bTEyLjYgMEgyNHYxMS40SDEyLjZ6TTAgMTIuNmgxMS40VjI0SDB6bTEyLjYgMEgyNFYyNEgxMi42eiIvPjwvc3ZnPg%3D%3D)](${BASE}/DSHWork_Windows_x64.exe) | 双击安装；企业批量部署可选 [MSI 版](${BASE}/DSHWork_Windows_x64.msi) |
          | **macOS** | Apple Silicon（M1/M2/M3/M4） | [![macOS](https://img.shields.io/badge/-立即下载-8E8E93?logo=apple)](${BASE}/DSHWork_macOS_arm64.dmg) | 不确定芯片？见下方说明 |
          | **macOS** | Intel | [![macOS](https://img.shields.io/badge/-立即下载-8E8E93?logo=apple)](${BASE}/DSHWork_macOS_x64.dmg) | — |
          | **Ubuntu / Debian** | amd64 | [![deb](https://img.shields.io/badge/-立即下载-A80030?logo=debian&logoColor=white)](${BASE}/DSHWork_Linux_amd64.deb) | 或 [AppImage](${BASE}/DSHWork_Linux_amd64.AppImage) 免安装运行 |
          | **Fedora / RHEL** | x86_64 | [![rpm](https://img.shields.io/badge/-立即下载-294172?logo=fedora&logoColor=white)](${BASE}/DSHWork_Linux_x86_64.rpm) | 或 [AppImage](${BASE}/DSHWork_Linux_amd64.AppImage) 免安装运行 |

          > 🍎 **Mac 用户看这里：**
          > 1. 不确定选哪个？点按左上角  菜单 →「关于本机」：显示「芯片：Apple M…」下载 **arm64** 版；显示「处理器：Intel Core…」下载 **x64** 版。
          > 2. 首次打开若提示「"DSHWork" 已损坏，无法打开」，并非真的损坏（应用未做 Apple 签名公证，被 Gatekeeper 拦截）：把 DSHWork 拖入 Applications 后，**双击 dmg 窗口里的「首次打开修复.command」**即可自动修复；或手动执行终端命令 \`xattr -cr /Applications/DSHWork.app\`。详见 README「macOS 首次打开」一节。
          EOF
          cat release_body.md

      - name: Publish release
        # 用默认 GITHUB_TOKEN 即可：百度网盘上传（upload-baidu-pan job）走
        # 同一 run 内的 workflow_call 调用，不依赖 release published 事件
        # （GITHUB_TOKEN 产生的事件本就不会触发其他 workflow），无需 PAT
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'DSHWork ${{ github.ref_name }}'
          draft: false
          prerelease: false
          body_path: release_body.md
          generate_release_notes: true
          files: |
            *.dmg
            *.app.tar.gz
            *.deb
            *.rpm
            *.AppImage
            *.msi
            *.exe

  upload-baidu-pan:
    name: Upload to Baidu Netdisk
    # Release 发布成功后自动上传全部资产 + 说明文档到百度网盘（镜像分发渠道）。
    # 上传失败只影响本 job 状态，已发布的 GitHub Release 不受影响，可手动
    # dispatch upload-baidu-pan.yml 补传（幂等覆盖），详见该文件头注释。
    needs: release
    uses: ./.github/workflows/upload-baidu-pan.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
