name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    # 用 triple 命名：macOS 双架构同为 macos-latest runner，platform 无法区分
    name: Release (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 双架构都在 macos-latest（Apple Silicon）上构建：arm64 原生、
          # x64 交叉编译（下方 rustup target add）。macos-13（Intel runner）
          # 已于 2025-12-04 被 GitHub 退役，不可用。
          - platform: macos-latest
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            triple: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ''
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install macOS cross-compile targets
        # x86_64-apple-darwin 条目在 arm64 runner 上交叉编译，需显式安装目标；
        # aarch64 一并安装保证两个矩阵条目行为一致
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Fetch bundled dsh
        shell: bash
        run: ./scripts/fetch-dsh.sh

      - name: Fetch Node runtime and pnpm
        shell: bash
        run: ./scripts/fetch-runtime.sh ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: 'dsh-work ${{ env.TAG_NAME }}'
          # 保持草稿模式：由下方 publish-release job 在全平台矩阵成功后统一转正式发布，
          # 避免 releaseDraft: false 时第一个完成的平台立即公开不完整产物
          # （v0.1.2 曾因 AppImage 失败导致 Linux 产物缺失）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    # 全平台构建成功后才把草稿转为正式发布并标记 Latest
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
